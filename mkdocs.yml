# Project information
site_name: Infinity Roleplay
site_url: 'https://apv.infinityroleplay.nl/'
site_description: 'Wet en regelgeving van Infinity Roleplay'
site_author: 'Infinity Roleplay'

# Copyright
copyright: Copyright &copy; 2025 - 2026 Infinity Roleplay

# Congiguration
theme:
  name: cinder
  palette:
    - scheme: slate
      primary: "red"
      accent: "red"
  favicon: img/favicon.png
  logo: img/logo.png
  language: nl
plugins:
  - search:
      lang: nl
markdown_extensions:
  - admonition
  - attr_list
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js
  - javascripts/tables.js
nav:
  - Home: index.md
  - Algemene Plaatselijke Verordening: apv.md
  - Wetboek: wetboek.md
  - Onderwereld Regels: onderwereld.md
  - Douanegebieden: douanegebieden.md
